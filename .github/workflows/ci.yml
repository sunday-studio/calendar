name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]   # tags are built and tested by release.yml
  pull_request:
  workflow_call:
    inputs:
      ios:
        description: "Also run the (slow, macOS) iOS job"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when reused from release.yml, so the two never cancel each other
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) }}

env:
  GOTOOLCHAIN: local

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.f.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            ios:
              - 'ios/**'
              - 'api/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  server:
    name: server (vet, test, vuln)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  lint:
    name: golangci-lint (defaults, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true   # default linters only; flip this off once the first run is clean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: server

  e2e:
    name: e2e (hub against fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Does the Makefile have e2e-server?
        id: has
        run: |
          if make -n e2e-server >/dev/null 2>&1; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::no e2e-server target yet, skipping"; fi
      - name: make e2e-server
        if: steps.has.outputs.present == 'true'
        run: make e2e-server

  ios:
    name: ios (build, test)
    needs: changes
    # on main always; on other refs only when ios/**, api/** (or the Makefile) changed; never from release.yml unless asked
    if: ${{ (github.event_name != 'workflow_call' && (github.ref == 'refs/heads/main' || needs.changes.outputs.ios == 'true')) || inputs.ios == true }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devs in data.items():
              if "iOS" not in runtime:
                  continue
              ver = tuple(int(p) for p in runtime.rsplit("iOS-", 1)[-1].split("-") if p.isdigit())
              for d in devs:
                  if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                      key = (ver, "Pro" in d["name"] and "Max" not in d["name"])
                      if best is None or key > best[0]:
                          best = (key, d["udid"], d["name"])
          if best is None:
              sys.exit("no available iPhone simulator")
          print(best[1])
          sys.stderr.write("using %s\n" % best[2])
          ')
          echo "dest=platform=iOS Simulator,id=$udid" >> "$GITHUB_OUTPUT"
      - name: make ios-gen
        run: make ios-gen
      - name: make ios-build
        run: make ios-build IOS_DEST='${{ steps.sim.outputs.dest }}'
      - name: make ios-test
        run: make ios-test IOS_DEST='${{ steps.sim.outputs.dest }}'
      - name: Collect xcresult bundles
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/xcresult"
          find ~/Library/Developer/Xcode/DerivedData -name '*.xcresult' -exec cp -R {} "$RUNNER_TEMP/xcresult/" \; 2>/dev/null || true
      - name: Upload xcresult
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ${{ runner.temp }}/xcresult
          if-no-files-found: ignore
          retention-days: 7
